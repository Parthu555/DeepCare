apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepcare-ingress
  namespace: deepcare
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deepcare-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepcare-frontend
                port:
                  number: 80

