apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepcare-localstack
  namespace: deepcare
  labels:
    app: deepcare-localstack
    tier: cloud-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepcare-localstack
  template:
    metadata:
      labels:
        app: deepcare-localstack
        tier: cloud-mock
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: "s3"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: PERSISTENCE
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: deepcare-localstack
  namespace: deepcare
  labels:
    app: deepcare-localstack
    tier: cloud-mock
spec:
  type: ClusterIP
  ports:
    - port: 4566
      targetPort: 4566
      name: edge
  selector:
    app: deepcare-localstack
