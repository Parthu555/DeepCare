apiVersion: v1
kind: ConfigMap
metadata:
  name: deepcare-config
  namespace: deepcare
  labels:
    app.kubernetes.io/name: deepcare-config
    app.kubernetes.io/part-of: deepcare
data:
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "deepcare-medical-vault-dev"
  AWS_ENDPOINT_URL: "http://deepcare-localstack:4566"
  ML_MODEL_NAME: "DenseNet-121"
  ML_MODEL_VERSION: "1.0.0"
  ML_DEVICE: "cpu"
  API_V1_STR: "/api/v1"
  LOG_LEVEL: "INFO"
  LOCAL_STORAGE_DIR: "/app/storage"
---
apiVersion: v1
kind: Secret
metadata:
  name: deepcare-secrets
  namespace: deepcare
  labels:
    app.kubernetes.io/name: deepcare-secrets
    app.kubernetes.io/part-of: deepcare
type: Opaque
stringData:
  DATABASE_URL: "postgresql://deepcare_user:deepcare_pass@deepcare-postgres:5432/deepcare_db"
  POSTGRES_USER: "deepcare_user"
  POSTGRES_PASSWORD: "deepcare_pass"
  POSTGRES_DB: "deepcare_db"
  SECRET_KEY: "deepcare-ultra-secure-jwt-key-2026-production-ready"
  JWT_SECRET_KEY: "deepcare-ultra-secure-jwt-key-2026-production-ready"
  ADMIN_EMAIL: "admin@deepcare.health"
  ADMIN_PASSWORD: "AdminPass123!"
  AWS_ACCESS_KEY_ID: "mock_access_key"
  AWS_SECRET_ACCESS_KEY: "mock_secret_key"

