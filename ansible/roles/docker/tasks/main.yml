---
# Docker Installation & Daemon Configuration Role

- name: Check if Docker is already installed
  command: docker --version
  register: docker_installed
  changed_when: false
  failed_when: false

- name: Display current Docker version if installed
  debug:
    msg: "Existing Docker detected: {{ docker_installed.stdout }}"
  when: docker_installed.rc == 0

- name: Verify Docker daemon connectivity
  command: docker info
  register: docker_info
  changed_when: false
  failed_when: false

- name: Fail if Docker daemon is unreachable in local environment
  fail:
    msg: "Docker daemon is not running. Please start Docker Desktop or the docker service."
  when: is_local_deployment | default(false) and docker_info.rc != 0

# Remote Linux Node Installation (Ubuntu/Debian)
- name: Install prerequisite packages for Docker repository
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  become: true
  when: not (is_local_deployment | default(false)) and ansible_os_family == "Debian" and docker_installed.rc != 0

- name: Add Docker official GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true
  when: not (is_local_deployment | default(false)) and ansible_os_family == "Debian" and docker_installed.rc != 0

- name: Add Docker APT repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  become: true
  when: not (is_local_deployment | default(false)) and ansible_os_family == "Debian" and docker_installed.rc != 0

- name: Install Docker CE and Containerd
  apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  become: true
  notify: restart docker
  when: not (is_local_deployment | default(false)) and ansible_os_family == "Debian" and docker_installed.rc != 0

- name: Ensure /etc/docker directory exists
  file:
    path: /etc/docker
    state: directory
    mode: '0755'
  become: true
  when: not (is_local_deployment | default(false)) and (ansible_os_family == "Debian" or ansible_os_family == "RedHat")

- name: Configure Docker daemon systemd cgroup driver
  copy:
    content: "{{ docker_daemon_config | to_nice_json }}"
    dest: /etc/docker/daemon.json
    mode: '0644'
  become: true
  notify: restart docker
  when: not (is_local_deployment | default(false)) and (ansible_os_family == "Debian" or ansible_os_family == "RedHat")

- name: Ensure Docker service is enabled and running
  service:
    name: docker
    state: started
    enabled: true
  become: true
  when: not (is_local_deployment | default(false)) and (ansible_os_family == "Debian" or ansible_os_family == "RedHat")

