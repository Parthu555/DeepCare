# Multi-Node Kubernetes Production/Staging Cluster Inventory
# 1 Control-Plane Master Node + 2 Worker Nodes

[control_plane]
master-node-01 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa node_role=control-plane

[workers]
worker-node-01 ansible_host=192.168.1.101 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa node_role=worker
worker-node-02 ansible_host=192.168.1.102 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa node_role=worker

[k8s_cluster:children]
control_plane
workers

[all:vars]
environment_type=production
ansible_python_interpreter=/usr/bin/python3
pod_network_cidr="10.244.0.0/16"
kubernetes_version="1.29"
container_runtime="containerd"

