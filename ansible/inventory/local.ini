# Inventory for Local Development (KIND, Minikube, or Local Docker Control)
[local]
localhost ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python | default('/usr/bin/python3') }}"

[k8s_control_plane]
localhost ansible_connection=local

[k8s_workers]
# For local simulation, localhost manages worker containers or pods
localhost ansible_connection=local

[all:vars]
environment_type=local
is_local_deployment=true
kubeconfig_path="{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"

