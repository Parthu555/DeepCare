apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepcare-frontend
  namespace: deepcare
  labels:
    app.kubernetes.io/name: deepcare-frontend
    app.kubernetes.io/component: web-frontend
    app.kubernetes.io/part-of: deepcare
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: deepcare-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deepcare-frontend
        app.kubernetes.io/component: web-frontend
    spec:
      containers:
        - name: frontend
          image: deepcare-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

