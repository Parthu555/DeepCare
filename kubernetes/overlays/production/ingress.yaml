apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deepcare-production-ingress
  namespace: deepcare
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deepcare-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: deepcare-backend
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: deepcare-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: deepcare-backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Prefix
            backend:
              service:
                name: deepcare-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deepcare-frontend
                port:
                  number: 80

